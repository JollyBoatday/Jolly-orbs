<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Jolly Orbs</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400&display=swap"
    />
    <link rel="stylesheet" href="hark.css" />
    <link rel="stylesheet" href="hark-hero.css" />
    <style>
      html, body { height: 100%; }
      body.x-game-body {
        margin: 0;
        color-scheme: light;
        overflow: hidden;
        background:
          radial-gradient(circle at 20% 10%, #ffe8fb 0, transparent 45%),
          radial-gradient(circle at 85% 30%, #e1f3ff 0, transparent 45%),
          radial-gradient(circle at 50% 95%, #fff4c9 0, transparent 50%),
          linear-gradient(180deg, #f6e9ff, #e5f6ff);
        -webkit-tap-highlight-color: transparent;
        user-select: none;
        -webkit-user-select: none;
      }
      .x-game {
        --ink: #3b1f6e;
        --glow: 0 0 2px #fff, 0 0 4px #fff, 0 0 8px #fff, 0 0 14px #fff;
        font-family: ui-rounded, "SF Pro Rounded", "Nunito", var(--sans);
        color: var(--ink);
        height: 100dvh;
        max-width: 720px;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        padding: max(8px, env(safe-area-inset-top)) 10px max(8px, env(safe-area-inset-bottom));
        box-sizing: border-box;
      }
      .x-top { width: 100%; text-align: center; }
      .x-title {
        margin: 0;
        font-size: clamp(24px, 7vw, 38px);
        font-weight: var(--weight-bold);
        line-height: 1.1;
        text-shadow: var(--glow);
        letter-spacing: -0.01em;
      }
      .x-scores {
        display: flex; justify-content: center; flex-wrap: wrap; gap: 8px; margin: 6px 0 0;
      }
      .x-badge {
        display: inline-flex; align-items: center; gap: 6px;
        padding: 4px 14px; border-radius: var(--r-pill);
        background: rgb(255 255 255 / 0.75);
        box-shadow: 0 2px 10px rgb(120 60 200 / 0.18);
        font-size: clamp(16px, 4.6vw, 22px); font-weight: var(--weight-bold);
      }
      .x-badge.x-pop { animation: x-pop 0.5s var(--ease-out); }
      .x-stage {
        flex: 1; min-height: 0; width: 100%;
        container-type: size;
        display: flex; align-items: center; justify-content: center;
      }
      .x-board {
        position: relative;
        width: min(100cqw, calc(100cqh * 1179 / 1745));
        aspect-ratio: 1179 / 1745;
        border-radius: var(--r-l);
        overflow: hidden;
        box-shadow: 0 10px 40px rgb(120 60 200 / 0.3);
      }
      .x-board > img {
        position: absolute; inset: 0; width: 100%; height: 100%;
        object-fit: contain; display: block; pointer-events: none;
      }
      .x-orb {
        position: absolute;
        width: 13%; min-width: var(--tap); aspect-ratio: 1;
        transform: translate(-50%, -50%);
        border: 0; padding: 0; margin: 0;
        border-radius: 50%;
        background: transparent;
        cursor: pointer;
        touch-action: manipulation;
      }
      .x-orb::before {
        content: ""; position: absolute; inset: -55%;
        border-radius: 50%;
        background: radial-gradient(circle, #fff 0, var(--c) 22%, color-mix(in srgb, var(--c) 50%, transparent) 42%, transparent 68%);
        opacity: 0; transform: scale(0.6);
        transition: opacity 0.25s, transform 0.25s var(--ease-out);
        pointer-events: none; mix-blend-mode: screen;
      }
      .x-orb.is-lit::before { opacity: 1; transform: scale(1); }
      .x-orb.is-lit { animation: x-pulse 0.45s var(--ease-out); }
      .x-orb.is-hint::before { animation: x-twinkle 1.1s ease-in-out infinite; }
      .x-orb:focus-visible { outline: 4px solid #fff; outline-offset: 2px; }
      @keyframes x-pulse { 0% { transform: translate(-50%, -50%) scale(1); } 40% { transform: translate(-50%, -50%) scale(1.22); } 100% { transform: translate(-50%, -50%) scale(1); } }
      @keyframes x-twinkle { 0%, 100% { opacity: 0; transform: scale(0.7); } 50% { opacity: 0.6; transform: scale(0.9); } }
      @keyframes x-pop { 0% { transform: scale(1); } 40% { transform: scale(1.25); } 100% { transform: scale(1); } }

      .x-play {
        position: absolute; left: 50%; top: 43%;
        transform: translate(-50%, -50%);
        min-width: 46%; min-height: 76px;
        padding: 14px 28px;
        border: 4px solid #fff; border-radius: var(--r-pill);
        background-color: #ffb43a;
        background-image: linear-gradient(180deg, #ffd65a, #ffa63a);
        color: #3b1f6e;
        font: inherit; font-size: clamp(26px, 8cqw, 40px); font-weight: var(--weight-bold);
        text-shadow: 0 0 6px rgb(255 255 255 / 0.8);
        box-shadow: 0 0 0 6px rgb(255 255 255 / 0.4), 0 0 40px 10px rgb(255 220 90 / 0.9);
        cursor: pointer; z-index: 5;
        animation: x-breathe 1.8s ease-in-out infinite;
      }
      .x-play[hidden] { display: none; }
      @keyframes x-breathe {
        0%, 100% { transform: translate(-50%, -50%) scale(1); }
        50% { transform: translate(-50%, -50%) scale(1.07); box-shadow: 0 0 0 10px rgb(255 255 255 / 0.5), 0 0 60px 18px rgb(255 220 90 / 1); }
      }
      .x-cheer {
        position: absolute; left: 50%; top: 80%; z-index: 6;
        transform: translate(-50%, -50%) scale(0.4);
        margin: 0; white-space: nowrap;
        font-size: clamp(30px, 11cqw, 52px); font-weight: var(--weight-bold);
        color: #ff4fa3;
        text-shadow: var(--glow), 0 0 20px #fff;
        opacity: 0; pointer-events: none;
      }
      .x-cheer.is-on { animation: x-cheer 1.4s var(--ease-out) forwards; }
      .x-cheer.is-master { color: #7a3cff; top: 50%; }
      @keyframes x-cheer {
        0% { opacity: 0; transform: translate(-50%, -50%) scale(0.4); }
        20% { opacity: 1; transform: translate(-50%, -50%) scale(1.1); }
        75% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
        100% { opacity: 0; transform: translate(-50%, -60%) scale(1); }
      }
      .x-spark {
        position: absolute; z-index: 4; pointer-events: none;
        font-size: clamp(18px, 6cqw, 30px);
        left: var(--x); top: var(--y);
        animation: x-fly var(--d, 1s) var(--ease-out) forwards;
      }
      @keyframes x-fly {
        0% { transform: translate(-50%, -50%) scale(0.3) rotate(0); opacity: 1; }
        100% { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1) rotate(var(--r)); opacity: 0; }
      }
      .x-confetti {
        position: fixed; top: -20px; z-index: 20; pointer-events: none;
        width: 10px; height: 16px; border-radius: 3px;
        animation: x-fall var(--d) linear forwards;
      }
      @keyframes x-fall { to { transform: translate(var(--dx), 110vh) rotate(var(--r)); } }

      .x-status {
        margin: 0; min-height: 1.2em; text-align: center;
        font-size: clamp(22px, 6.4vw, 32px); font-weight: var(--weight-bold);
        text-shadow: var(--glow);
      }
      .x-controls { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
      .x-toggle {
        min-height: var(--tap); min-width: var(--tap);
        padding: 6px 14px; border-radius: var(--r-pill);
        border: 2px solid #fff;
        background: rgb(255 255 255 / 0.7);
        color: var(--ink);
        font: inherit; font-size: var(--size-body); font-weight: var(--weight-bold);
        box-shadow: 0 2px 10px rgb(120 60 200 / 0.15);
        cursor: pointer;
      }
      .x-toggle[aria-pressed="true"] { background: #fff3b0; }
      .x-help {
        margin: 0; max-width: 34ch; text-align: center;
        padding: 10px 16px; border-radius: var(--r-m);
        background: rgb(255 255 255 / 0.85);
        font-size: var(--size-prose); font-weight: var(--weight-bold);
      }
      .x-help[hidden] { display: none; }
      .x-credit { margin: auto 0 0; font: var(--type-caption); color: var(--ink); opacity: 0.75; text-align: center; }
      @media (prefers-reduced-motion: reduce) {
        .x-play, .x-orb.is-hint::before { animation: none; }
        .x-orb.is-lit { animation: none; }
      }
    </style>
  </head>
  <body class="x-game-body">
    <div class="page" id="top">
      <main class="x-game">
        <header class="x-top">
          <h1 class="x-title">Jolly Orbs ✨</h1>
          <p class="x-scores">
            <span class="x-badge" id="round">Round 1</span>
            <span class="x-badge" id="score" aria-label="Score">⭐ 0</span>
            <span class="x-badge" id="best">🏆 Best: 0</span>
          </p>
        </header>

        <div class="x-stage">
          <div class="x-board" id="board">
            <img src="orb_board.jpg" alt="A golden magic circle with nine glowing orbs on a rainbow sky" />
            <button class="x-orb" data-i="0" style="left:50.9%;top:19.8%;--c:#ff8a1f" aria-label="Fire orb"></button>
            <button class="x-orb" data-i="1" style="left:20.1%;top:29.8%;--c:#ff3b5c" aria-label="Lotus orb"></button>
            <button class="x-orb" data-i="2" style="left:81.8%;top:30.1%;--c:#3bdc5a" aria-label="Leaf orb"></button>
            <button class="x-orb" data-i="3" style="left:20.6%;top:43.3%;--c:#ffe54a" aria-label="Moon orb"></button>
            <button class="x-orb" data-i="4" style="left:50.9%;top:43%;--c:#ffc21a" aria-label="Sun orb"></button>
            <button class="x-orb" data-i="5" style="left:81.7%;top:43.6%;--c:#7fdcff" aria-label="Star orb"></button>
            <button class="x-orb" data-i="6" style="left:26.5%;top:56.7%;--c:#ffd400" aria-label="Sunburst orb"></button>
            <button class="x-orb" data-i="7" style="left:75.7%;top:57.9%;--c:#b45cff" aria-label="Swirl orb"></button>
            <button class="x-orb" data-i="8" style="left:50.9%;top:64.5%;--c:#3f8cff" aria-label="Snowflake orb"></button>
            <button class="x-play" id="play" type="button">▶ Play</button>
            <p class="x-cheer" id="cheer" aria-hidden="true"></p>
          </div>
        </div>

        <p class="x-status" id="status" role="status" aria-live="polite">Tap Play! 🌟</p>

        <div class="x-controls">
          <button class="x-toggle" id="helpBtn" type="button" aria-expanded="false" aria-controls="help">❓ How to play</button>
          <button class="x-toggle" id="soundBtn" type="button" aria-pressed="true">🔊 Sound on</button>
          <button class="x-toggle" id="easyBtn" type="button" aria-pressed="true">💡 Easy on</button>
        </div>
        <p class="x-help" id="help" hidden>Watch the orbs light up. Then tap them in the same order!</p>
        <p class="x-credit">By Jolly Boat Day Day</p>
      </main>
    </div>
    <script src="hark.js"></script>
    <script>
      (function () {
        var NOTES = [261.63, 293.66, 329.63, 392.0, 440.0, 523.25, 587.33, 659.25, 783.99];
        var CHEERS = ["Magic!", "You did it!", "Wow!", "Super star!"];
        var orbs = Array.prototype.slice.call(document.querySelectorAll(".x-orb"));
        var board = document.getElementById("board");
        var playBtn = document.getElementById("play");
        var statusEl = document.getElementById("status");
        var roundEl = document.getElementById("round");
        var scoreEl = document.getElementById("score");
        var bestEl = document.getElementById("best");
        var cheerEl = document.getElementById("cheer");
        var soundBtn = document.getElementById("soundBtn");
        var easyBtn = document.getElementById("easyBtn");
        var helpBtn = document.getElementById("helpBtn");
        var helpEl = document.getElementById("help");

        var seq = [], round = 1, idx = 0, misses = 0, score = 0, best = 0;
        var locked = true, playing = false, sound = true, easy = true;
        var hintTimer = null, timers = [];
        var ac = null;

        function later(fn, ms) { var t = setTimeout(fn, ms); timers.push(t); return t; }
        function clearTimers() { timers.forEach(clearTimeout); timers = []; clearHint(); }

        /* ---------- sound ---------- */
        function audio() {
          if (!ac) {
            var A = window.AudioContext || window.webkitAudioContext;
            if (!A) return null;
            ac = new A();
          }
          if (ac.state === "suspended") ac.resume();
          return ac;
        }
        function tone(freq, start, dur, type, vol, endFreq) {
          if (!sound) return;
          var c = audio(); if (!c) return;
          var t = c.currentTime + (start || 0);
          var o = c.createOscillator(), g = c.createGain();
          o.type = type || "triangle";
          o.frequency.setValueAtTime(freq, t);
          if (endFreq) o.frequency.exponentialRampToValueAtTime(endFreq, t + dur);
          g.gain.setValueAtTime(0.0001, t);
          g.gain.exponentialRampToValueAtTime(vol || 0.3, t + 0.02);
          g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
          o.connect(g); g.connect(c.destination);
          o.start(t); o.stop(t + dur + 0.05);
        }
        function note(i, dur) {
          tone(NOTES[i], 0, dur || 0.5, "triangle", 0.32);
          tone(NOTES[i] * 2, 0, (dur || 0.5) * 0.6, "sine", 0.06);
        }
        function chime() { [523.25, 659.25, 783.99, 1046.5].forEach(function (f, k) { tone(f, k * 0.09, 0.45, "sine", 0.22); }); }
        function fanfare() { [392, 523.25, 659.25, 783.99, 1046.5, 1318.5].forEach(function (f, k) { tone(f, k * 0.1, 0.6, "triangle", 0.2); }); }
        function boop() { tone(330, 0, 0.35, "sine", 0.2, 220); }

        /* ---------- visuals ---------- */
        function light(i, ms) {
          var o = orbs[i];
          o.classList.remove("is-lit"); void o.offsetWidth;
          o.classList.add("is-lit");
          later(function () { o.classList.remove("is-lit"); }, ms);
        }
        function sparkle(count, center) {
          var marks = ["✨", "⭐", "🌟", "💫"];
          for (var k = 0; k < count; k++) {
            var s = document.createElement("span");
            s.className = "x-spark"; s.setAttribute("aria-hidden", "true");
            s.textContent = marks[k % marks.length];
            var a = Math.random() * Math.PI * 2, r = 25 + Math.random() * 45;
            s.style.setProperty("--x", (center ? center[0] : 50) + "%");
            s.style.setProperty("--y", (center ? center[1] : 43) + "%");
            s.style.setProperty("--dx", Math.cos(a) * r + "cqw");
            s.style.setProperty("--dy", Math.sin(a) * r + "cqw");
            s.style.setProperty("--r", (Math.random() * 360 - 180) + "deg");
            s.style.setProperty("--d", (0.8 + Math.random() * 0.6) + "s");
            board.appendChild(s);
            setTimeout(function (el) { el.remove(); }.bind(null, s), 1600);
          }
        }
        function confetti() {
          var colors = ["#ff4fa3", "#ffd400", "#3bdc5a", "#3f8cff", "#b45cff", "#ff8a1f", "#7fdcff"];
          for (var k = 0; k < 80; k++) {
            var c = document.createElement("span");
            c.className = "x-confetti"; c.setAttribute("aria-hidden", "true");
            c.style.left = Math.random() * 100 + "vw";
            c.style.background = colors[k % colors.length];
            c.style.setProperty("--dx", (Math.random() * 120 - 60) + "px");
            c.style.setProperty("--r", (Math.random() * 1080 - 540) + "deg");
            c.style.setProperty("--d", (1.8 + Math.random() * 1.6) + "s");
            c.style.animationDelay = Math.random() * 0.5 + "s";
            document.body.appendChild(c);
            setTimeout(function (el) { el.remove(); }.bind(null, c), 4200);
          }
        }
        function cheer(text, master) {
          cheerEl.textContent = text;
          cheerEl.classList.toggle("is-master", !!master);
          cheerEl.classList.remove("is-on"); void cheerEl.offsetWidth;
          cheerEl.classList.add("is-on");
        }
        function pop(el) { el.classList.remove("x-pop"); void el.offsetWidth; el.classList.add("x-pop"); }
        function setStatus(t) { statusEl.textContent = t; }
        function updateBadges() {
          roundEl.textContent = "Round " + round;
          scoreEl.textContent = "⭐ " + score;
          bestEl.textContent = "🏆 Best: " + best;
        }

        /* ---------- hint ---------- */
        function clearHint() {
          if (hintTimer) { clearTimeout(hintTimer); hintTimer = null; }
          orbs.forEach(function (o) { o.classList.remove("is-hint"); });
        }
        function scheduleHint() {
          clearHint();
          if (!easy || locked || !playing) return;
          hintTimer = setTimeout(function () {
            if (!locked && playing && easy) orbs[seq[idx]].classList.add("is-hint");
          }, 3000);
        }

        /* ---------- game ---------- */
        function rand() { return Math.floor(Math.random() * 9); }
        function stepMs() { return round > 5 ? Math.max(450, 800 - (round - 5) * 50) : 800; }

        function showSequence() {
          locked = true; clearHint();
          setStatus("Watch the magic…");
          var ms = stepMs();
          seq.forEach(function (i, k) {
            later(function () { light(i, ms * 0.7); note(i, ms / 1000 * 0.8); }, 600 + k * ms);
          });
          later(function () {
            locked = false; idx = 0;
            setStatus("Your turn!");
            scheduleHint();
          }, 600 + seq.length * ms);
        }

        function start() {
          audio();
          clearTimers();
          seq = [rand()]; round = 1; idx = 0; misses = 0; score = 0;
          playing = true;
          playBtn.hidden = true;
          updateBadges();
          showSequence();
        }

        function success() {
          locked = true; clearHint();
          score = round;
          if (round > best) best = round;
          var master = round === 5 || round === 10;
          later(function () {
            chime();
            sparkle(14);
            updateBadges(); pop(scoreEl);
            if (master) {
              confetti(); fanfare();
              cheer("Orb Master! 🏆", true);
              setStatus("Orb Master!");
            } else {
              var c = CHEERS[Math.floor(Math.random() * CHEERS.length)];
              cheer(c);
              setStatus(c);
            }
          }, 350);
          later(function () {
            round++; misses = 0;
            seq.push(rand());
            updateBadges(); pop(roundEl);
            showSequence();
          }, master ? 2600 : 1700);
        }

        function miss() {
          locked = true; clearHint();
          misses++;
          later(boop, 150);
          if (misses >= 3) {
            playing = false;
            setStatus("Great try! Play again?");
            later(function () {
              round = 1; updateBadges();
              playBtn.textContent = "▶ Play again";
              playBtn.hidden = false;
            }, 600);
          } else {
            setStatus("Oops! Let's watch again 🌈");
            later(showSequence, 1300);
          }
        }

        orbs.forEach(function (o) {
          o.addEventListener("click", function () { tap(+o.dataset.i); });
        });

        function tap(i) {
          if (!playing) {
            /* before a game: free play, each orb still glows and sings */
            light(i, 380);
            note(i, 0.45);
            sparkle(4, [parseFloat(orbs[i].style.left), parseFloat(orbs[i].style.top)]);
            return;
          }
          if (locked) return;
          clearHint();
          light(i, 380);
          note(i, 0.45);
          if (seq[idx] === i) {
            idx++;
            if (idx === seq.length) success();
            else scheduleHint();
          } else {
            miss();
          }
        }

        playBtn.addEventListener("click", start);

        soundBtn.addEventListener("click", function () {
          sound = !sound;
          soundBtn.setAttribute("aria-pressed", String(sound));
          soundBtn.textContent = sound ? "🔊 Sound on" : "🔇 Sound off";
          if (sound) audio();
        });
        easyBtn.addEventListener("click", function () {
          easy = !easy;
          easyBtn.setAttribute("aria-pressed", String(easy));
          easyBtn.textContent = easy ? "💡 Easy on" : "💡 Easy off";
          if (easy) scheduleHint(); else clearHint();
        });
        helpBtn.addEventListener("click", function () {
          var open = helpEl.hidden;
          helpEl.hidden = !open;
          helpBtn.setAttribute("aria-expanded", String(open));
        });

        updateBadges();
      })();
    </script>
  </body>
</html>
